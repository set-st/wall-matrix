# Час, погода з Home Assistant, датчик освітленості (налаштування яскравості — в admin.yaml)

globals:
  - id: auto_level
    type: float
    initial_value: "1.0"

# Обидва джерела ставлять спільний системний годинник: екран бере час через ha_time,
# а SNTP підстраховує, коли Home Assistant недоступний.
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com

# --- Погода: сутність задається з веб-панелі (вкладка «Застосунки» → «Погода») ---
# weather.* — температура з атрибута temperature, стан (sunny, rainy…) — для іконки;
# sensor.*  — температура зі стану сенсора, іконка — «хмарно».
text:
  - platform: template
    id: weather_entity
    name: "Weather entity"
    icon: mdi:weather-partly-cloudy
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: "${weather_entity}"
    entity_category: config
    on_value:
      then:
        - lambda: |-
            const std::string e = x;
            id(weather_temp).publish_state(NAN);
            id(weather_state).publish_state("");
            if (e.empty()) return;
            const bool is_weather = e.rfind("weather.", 0) == 0;
            id(web_panel)->watch_ha(e, is_weather ? "temperature" : "", [e](const std::string &v) {
              if (id(weather_entity).state != e) return;  // сутність уже змінили
              const auto f = parse_number<float>(v);
              id(weather_temp).publish_state(f.has_value() ? *f : NAN);
            });
            if (is_weather)
              id(web_panel)->watch_ha(e, "", [e](const std::string &v) {
                if (id(weather_entity).state != e) return;
                id(weather_state).publish_state(v);
              });

sensor:
  - platform: template
    id: weather_temp
    internal: true
    update_interval: never
    accuracy_decimals: 1

  # Фоторезистор: 3.3V — LDR — GPIO — 10 кОм — GND (світліше → вища напруга)
  - platform: adc
    id: ldr_voltage
    name: "Ambient light"
    pin: ${ldr_pin}
    attenuation: 12db
    update_interval: 1s
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2
    on_value:
      then:
        - lambda: |-
            const float min_b = id(min_brightness_pct).state / 100.0f;
            const float n = std::min(std::max(x / 3.0f, 0.0f), 1.0f);
            id(auto_level) = min_b + (1.0f - min_b) * n;

text_sensor:
  - platform: template
    id: weather_state
    internal: true
    update_interval: never

