# Плата, мережа, API (сповіщення, текст)

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Налаштування пишуться у флеш через 5 с після зміни (типово 60 с — зміна губилася,
# якщо вимкнути живлення протягом хвилини). Пишуться лише змінені значення.
preferences:
  flash_write_interval: 5s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password
  on_connect:
    - light.turn_off: status_led
  on_disconnect:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 30%

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key
  # Підписки на довільні сутності HA під час роботи (погода тощо, див. matrix_web/ha.cpp)
  homeassistant_states: true
  actions:
    # Home Assistant: action esphome.wall_matrix_notify
    #   message:  текст сповіщення (кирилиця підтримується)
    #   duration: скільки секунд показувати (0 → значення з веб-панелі)
    #   color:    колір рамки, "#RRGGBB" (порожньо → колір з веб-панелі)
    - action: notify
      variables:
        message: string
        duration: int
        color: string
      then:
        - script.execute:
            id: notify_show
            message: !lambda 'return message;'
            duration: !lambda 'return duration;'
            color: !lambda 'return color;'
    - action: dismiss
      then:
        - lambda: 'id(web_panel)->dismiss();'
    # Home Assistant: action esphome.wall_matrix_set_text
    #   line1, line2: рядки текстового застосунку; підстановки {time} {date} {day} {temp}
    #   show: true — одразу перемкнутися на текстовий екран
    - action: set_text
      variables:
        line1: string
        line2: string
        show: bool
      then:
        - text.set:
            id: text_line1
            value: !lambda 'return line1;'
        - text.set:
            id: text_line2
            value: !lambda 'return line2;'
        - lambda: 'if (show) id(web_panel)->interrupt_with("Text");'

