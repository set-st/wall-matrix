<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23171717'/%3E%3Crect x='0.5' y='0.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='4.5' y='0.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='8.5' y='0.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='12.5' y='0.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='0.5' y='4.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='4.5' y='4.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='8.5' y='4.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='12.5' y='4.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='0.5' y='8.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='4.5' y='8.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='8.5' y='8.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='12.5' y='8.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='0.5' y='12.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3Crect x='4.5' y='12.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='8.5' y='12.5' width='3' height='3' rx='.4' fill='%233a2a1d'/%3E%3Crect x='12.5' y='12.5' width='3' height='3' rx='.4' fill='%23f5a568'/%3E%3C/svg%3E">
<title>Wall Matrix</title>
<style>
  /* Палітра й пропорції — у дусі AWTRIX NG */
  :root {
    --bg: #171717;
    --card: #222221;
    --card2: #292927;
    --border: #373632;
    --brd2: #302f2b;
    --fg: #f3f1ec;
    --dim: #a6a198;
    --acc: #f5a568;
    --onacc: #23170e;
    --ok: #8fbf72;
    --err: #ff9d90;
    --warn: #ffb65c;
    --con: #10100f;
    --trk: #514e47;
    --r: 12px;
    --mono: "Cascadia Mono", "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 14px/1.45 "Segoe UI Variable", Aptos, system-ui, sans-serif;
    background-image: radial-gradient(circle, rgba(245,165,104,.07) 1px, transparent 1.2px);
    background-size: 16px 16px; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

  /* ---------- шапка + навігація ---------- */
  .top { position: sticky; top: 0; z-index: 5; background: rgba(23,23,23,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--brd2); margin-bottom: 18px; }
  .top .wrap { padding-top: 12px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .logo { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; }
  .logo i { background: #3a2a1d; border-radius: 1px; }
  .logo i.on { background: var(--acc); }
  .head h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim);
    font: 12px var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
  .dot.ok { background: var(--ok); }
  nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  nav a { position: relative; padding: 8px 12px 10px; color: var(--dim); text-decoration: none; white-space: nowrap;
    border-radius: 8px 8px 0 0; font-size: 13.5px; cursor: pointer; user-select: none; }
  nav a:hover { color: var(--fg); }
  nav a.active { color: var(--fg); font-weight: 600; }
  nav a.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px;
    border-radius: 2px; background: var(--acc); }

  .page { display: none; }
  .page.active { display: block; }

  /* ---------- картки ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 14px;
    box-shadow: 0 1px 2px #0006; }
  .card.pad { padding: 14px; }
  .sec-h { padding: 12px 16px 10px; border-bottom: 1px solid var(--brd2); position: relative; }
  .sec-h::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: 0; width: 3px;
    background: var(--acc); border-top-left-radius: var(--r); }
  .sec-h b { display: block; font-size: 15px; }
  .sec-h span { color: var(--dim); font-size: 12.5px; }
  .sec-b { padding: 0 16px; }

  /* ---------- рядки налаштувань ---------- */
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--brd2); }
  .row:last-child { border-bottom: 0; }
  .lbl { flex: 1; min-width: 0; }
  .lbl b { display: block; font-weight: 600; font-size: 13.5px; }
  .lbl span { display: block; color: var(--dim); font-size: 12px; }
  .val { color: var(--dim); font: 12px var(--mono); white-space: nowrap; }

  /* ---------- елементи керування ---------- */
  button, .btn { background: var(--card2); color: var(--fg); border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center;
    gap: 6px; white-space: nowrap; }
  button:hover, .btn:hover { border-color: var(--acc); }
  button.primary { background: var(--acc); border-color: var(--acc); color: var(--onacc); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--err); }
  button.danger:hover { border-color: var(--err); }
  .ibtn { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 15px; }

  .sw { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 42px; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: var(--trk); border-radius: 24px; cursor: pointer; transition: .18s; }
  .sw span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .18s; box-shadow: 0 1px 2px #0006; }
  .sw input:checked + span { background: var(--acc); }
  .sw input:checked + span::before { transform: translateX(18px); }

  input[type=range] { --p: 50%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; outline: none;
    background: linear-gradient(to right, var(--acc) var(--p), var(--trk) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--acc); cursor: pointer; border: 0; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--acc);
    cursor: pointer; border: 0; }
  .slider { display: flex; align-items: center; gap: 10px; width: 230px; }
  .slider input { flex: 1; }
  .slider .val { min-width: 56px; text-align: right; }

  input[type=number], input[type=text], input[type=password], select, textarea {
    background: var(--con); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font: inherit; font-size: 13px; }
  input[type=number] { width: 80px; text-align: right; font-family: var(--mono); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); }
  textarea { width: 100%; min-height: 64px; resize: vertical; }
  .unit { color: var(--dim); font: 12px var(--mono); }
  .color { display: flex; align-items: center; gap: 8px; }
  .color input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 7px;
    background: none; cursor: pointer; }
  .color input[type=text] { width: 92px; font-family: var(--mono); text-transform: uppercase; }
  .line-input { flex: 1; min-width: 0; }
  .row.line .lbl { flex: 0 0 120px; }

  /* ---------- панель: живий екран ---------- */
  .live { background: #000; border-radius: 9px; padding: 8px; }
  canvas { width: 100%; height: auto; display: block; }
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .ctrl .grow { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; }
  .ctrl .grow input { flex: 1; }
  .ctrl .lab { color: var(--dim); font-size: 13px; }
  .ctrl .sep { width: 1px; height: 22px; background: var(--border); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; }
  .stat small { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .stat b { display: block; font: 600 20px var(--mono); margin: 4px 0 6px; }
  .stat b em { font-style: normal; font-size: 11px; color: var(--dim); margin-left: 2px; }
  .stat .bar { height: 3px; background: var(--trk); border-radius: 3px; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .stat .foot { color: var(--dim); font: 11.5px var(--mono); margin-top: 6px; }

  .info { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; font: 12px var(--mono); color: var(--dim); }
  .info b { color: var(--fg); font-weight: 600; margin-left: 6px; }

  /* ---------- текст / іконка ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; }
  .chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 999px; background: var(--con);
    border: 1px solid var(--border); cursor: pointer; color: var(--dim); }
  .chip:hover { border-color: var(--acc); color: var(--fg); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 0 14px; }
  .muted { color: var(--dim); font-size: 12.5px; }
  .counter { margin-left: auto; color: var(--dim); font: 12px var(--mono); }

  .icon-box { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 0; }
  .icon-prev { width: 120px; height: 120px; background: #000; border-radius: 9px; padding: 6px; flex: none; }
  .icon-side { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 10px; }
  .icon-side .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=file] { display: none; }

  /* черга застосунків */
  .app-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--brd2); }
  .app-row:last-child { border-bottom: 0; }
  .app-row .pos { font: 12px var(--mono); color: var(--dim); width: 18px; text-align: right; }
  .app-row .nm { flex: 1; min-width: 0; }
  .app-row .nm b { font-weight: 600; }
  .app-row .nm span { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-row.active .nm b { color: var(--acc); }
  .app-row.gone { opacity: .5; }
  .badge { font: 11px var(--mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
  .badge.pushed { color: var(--acc); border-color: #5a3d26; }
  .mini { width: 30px; height: 30px; padding: 0; justify-content: center; }

  /* бібліотека іконок */
  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 14px 0; }
  .tile { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex;
    flex-direction: column; gap: 6px; align-items: stretch; }
  .tile canvas { width: 100%; aspect-ratio: 1; background: #000; border-radius: 7px; }
  .tile .tn { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .tm { color: var(--dim); font: 11px var(--mono); }
  .tile .tb { display: flex; gap: 6px; }
  .tile .tb button { flex: 1; padding: 4px 6px; font-size: 12px; justify-content: center; }
  .store { height: 4px; background: var(--trk); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .store i { display: block; height: 100%; background: var(--acc); }
  .add-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 0; }
  .add-row input[type=text] { width: 180px; font-family: var(--mono); }

  /* пошук сутностей HA */
  .ent { position: relative; flex: 0 1 300px; min-width: 200px; }
  .ent input { width: 100%; font-family: var(--mono); }
  .ent-list { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); max-height: 280px; overflow-y: auto;
    background: var(--card2); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 6px 18px #000a; }
  .ent-item { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; width: 100%; padding: 7px 10px; border: 0;
    border-radius: 0; background: none; text-align: left; border-bottom: 1px solid var(--brd2); }
  .ent-item:last-child { border-bottom: 0; }
  .ent-item:hover, .ent-item.on { background: #3a2a1d; }
  .ent-item b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ent-item code { grid-column: 1; color: var(--dim); font: 11.5px var(--mono); overflow: hidden; text-overflow: ellipsis; }
  .ent-item span { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--acc); font: 12px var(--mono); }
  .ent-note { padding: 10px; color: var(--dim); font-size: 12.5px; }
  .ha-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; padding: 14px 0 6px; align-items: center; }
  .ha-form input { width: 100%; font-family: var(--mono); }
  @media (max-width: 600px) { .ha-form { grid-template-columns: 1fr; } }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(80px);
    background: var(--card2); border: 1px solid var(--border); padding: 9px 14px; border-radius: 9px;
    transition: .25s; opacity: 0; font-size: 13px; }
  .toast.show { transform: translateX(-50%); opacity: 1; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin: 6px 0 22px; }

  @media (max-width: 600px) {
    .slider { width: 160px; }
    .row { flex-wrap: wrap; }
    .row.line .lbl { flex-basis: 100%; }
    .ctrl .sep { display: none; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="head">
      <div class="logo" id="logo"></div>
      <h1>Wall Matrix</h1>
      <div class="status"><span id="statusText">з'єднання…</span><span class="dot" id="statusDot"></span></div>
    </div>
    <nav id="nav">
      <a data-page="dash" class="active">Панель</a>
      <a data-page="apps">Застосунки</a>
      <a data-page="text">Текст</a>
      <a data-page="icons">Іконки</a>
      <a data-page="look">Вигляд</a>
      <a data-page="notify">Сповіщення</a>
      <a data-page="display">Екран</a>
      <a data-page="system">Система</a>
    </nav>
  </div>
</div>

<div class="wrap">

  <!-- ===== Панель ===== -->
  <section class="page active" id="page-dash">
    <div class="card pad">
      <div class="live"><canvas id="live" width="640" height="320"></canvas></div>
      <div class="ctrl">
        <label class="sw"><input type="checkbox" id="power"><span></span></label><span class="lab">Матриця</span>
        <span class="sep"></span>
        <div class="grow"><span class="lab">Яскравість</span>
          <input type="range" id="brightness" min="5" max="100" step="1">
          <span class="val" id="brightnessVal">–</span>
        </div>
        <label class="sw"><input type="checkbox" id="autoBr"><span></span></label><span class="lab">Авто</span>
        <span class="sep"></span>
        <button class="ibtn" id="showTextQuick" title="Показати текст">T</button>
        <button class="ibtn" id="prev" title="Попередній застосунок">⏮</button>
        <button class="ibtn" id="next" title="Наступний застосунок">⏭</button>
        <button class="ibtn" id="shot" title="Зберегти знімок екрана">⤓</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card info" id="info"></div>
  </section>

  <!-- ===== Сторінки налаштувань (будуються зі опису PAGES) ===== -->
  <section class="page" id="page-apps"></section>
  <section class="page" id="page-text"></section>
  <section class="page" id="page-icons"></section>
  <section class="page" id="page-look"></section>
  <section class="page" id="page-notify"></section>
  <section class="page" id="page-display"></section>
  <section class="page" id="page-system"></section>

  <footer>Wall Matrix · власна прошивка на ESPHome</footer>
</div>
<div class="toast" id="toast"></div>

<!-- Шаблони спеціальних блоків -->
<template id="tpl-text-extra">
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button class="primary" id="showText">▶ Показати зараз</button>
    <span class="muted">≈ 8 символів у рядку; довший текст біжить</span>
  </div>
</template>
<template id="tpl-icon-pick">
  <div class="row"><div class="lbl"><b>Іконка</b><span>З бібліотеки (вкладка «Іконки»).</span></div>
    <canvas id="textIconPrev" width="48" height="48" style="width:32px;height:32px;background:#000;border-radius:5px"></canvas>
    <select id="textIconSel"></select></div>
</template>
<template id="tpl-ha">
  <div class="ha-form">
    <input type="text" id="haUrl" placeholder="http://homeassistant.local:8123">
    <input type="password" id="haToken" placeholder="Довготривалий токен доступу" autocomplete="off">
    <div style="display:flex;gap:8px"><button class="primary" id="haSave">Перевірити</button><button id="haForget">Забути</button></div>
  </div>
  <div class="muted" id="haStatus" style="padding-bottom:14px"></div>
</template>
<template id="tpl-apps">
  <div id="appList"></div>
  <div class="actions"><span class="muted">Pushed-застосунки створюються через API:
    <code>POST /api/v1/apps/&lt;ім'я&gt;</code> — див. README.</span></div>
</template>
<template id="tpl-icon-add">
  <div class="add-row">
    <input type="text" id="icName" maxlength="23" placeholder="ім'я (a-z, 0-9, _ -)">
    <select id="icSize"><option value="16">16×16</option><option value="8">8×8</option></select>
    <label class="btn primary" for="icFile" style="background:var(--acc);color:var(--onacc);border-color:var(--acc)">Обрати файл і завантажити</label>
    <input type="file" id="icFile" accept="image/png,image/gif,image/jpeg,image/webp,image/bmp">
  </div>
  <div class="muted" style="padding-bottom:14px">PNG, JPG, WebP, BMP або GIF (до 16 кадрів; потрібен Chrome). Картинка зменшується
    у браузері; чорні пікселі прозорі. Ім'я порожнє — візьметься з назви файлу.</div>
</template>
<template id="tpl-icon-lib">
  <div class="store"><i id="icStore"></i></div>
  <div class="muted" id="icStoreTxt" style="margin-top:6px"></div>
  <div class="icon-grid" id="icGrid"></div>
</template>
<template id="tpl-notify">
  <div style="padding-top:14px"><textarea id="notifyText" maxlength="120" placeholder="Текст сповіщення"></textarea></div>
  <div class="row"><div class="lbl"><b>Іконка</b><span>З іконкою — дрібний текст праворуч, без рамки.</span></div>
    <select id="notifyIcon"></select></div>
  <div class="actions">
    <button class="primary" id="notifySend">Надіслати</button>
    <button id="notifyDismiss">Прибрати</button>
    <span class="counter" id="notifyCount">0 / 120</span>
  </div>
</template>

<script>
"use strict";

/* ===================== опис інтерфейсу ===================== */
// Сторінка = список секцій; секція = { h, sub, items | tpl }. Ключі — id сутностей з YAML.
const PAGES = {
  apps: [
    { h: "Черга", sub: "Порядок показу (↑ ↓), увімкнення та миттєвий показ. Як в AWTRIX NG.", tpl: "tpl-apps" },
    { h: "Годинник", sub: "Великі цифри, двокрапка і смужка секунд.", items: [
      { t: "switch", id: "app_clock", label: "Показувати" },
      { t: "number", id: "clock_secs", label: "Тривалість", hint: "Скільки секунд екран тримається.", unit: "с", kind: "box" } ] },
    { h: "Дата", sub: "День і місяць, знизу — день тижня.", items: [
      { t: "switch", id: "app_date", label: "Показувати" },
      { t: "number", id: "date_secs", label: "Тривалість", unit: "с", kind: "box" } ] },

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let state = null;

const binders = [];

function fmtUptime(s) {
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}д ${h}г` : h ? `${h}г ${m}хв` : `${m}хв ${s % 60}с`;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove("show"), 1800);
}
async function post(url, data, body, type) {
  const opts = { method: "POST" };
  if (body != null) {
    opts.body = body;
    opts.headers = { "Content-Type": type || "text/plain; charset=utf-8" };
    if (data) url += "?" + new URLSearchParams(data);
  } else {
    opts.body = new URLSearchParams(data || {});
  }
  try {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(r.status);
    setTimeout(loadState, 250);
    return true;
  } catch (e) { toast("Помилка: " + e.message); return false; }
}
const setVal = (type, id, v) => post("/api/set", { type, id, v });
// /api/v1: JSON або двійкові дані; повертає розібраний JSON або кидає помилку з повідомленням
async function api(method, path, body, type) {
  const opts = { method };
  if (body !== undefined) {
    opts.body = (type || body instanceof Uint8Array) ? body : JSON.stringify(body);
    opts.headers = { "Content-Type": type || (body instanceof Uint8Array ? "application/octet-stream" : "application/json") };
  }
  const r = await fetch("/api/v1/" + path, opts);
  const ct = r.headers.get("Content-Type") || "";
  const data = ct.includes("json") ? await r.json() : new Uint8Array(await r.arrayBuffer());
  if (!r.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + r.status));
  return data;
}
const apiTry = async (...a) => { try { const d = await api(...a); setTimeout(loadState, 250); return d || true; } catch (e) { toast("Помилка: " + e.message); return null; } };
const press = id => post("/api/press", { id });
const isHex = v => /^#[0-9a-f]{6}$/i.test(v);
const fillRange = i => i.style.setProperty("--p", ((i.value - (i.min || 0)) / ((i.max || 100) - (i.min || 0)) * 100) + "%");

function colorPicker(id) {
  const box = el("div", "color");
  const c = el("input"); c.type = "color";
  const tx = el("input"); tx.type = "text"; tx.maxLength = 7;
  const send = v => { if (isHex(v)) setVal("text", id, v.toUpperCase()); else toast("Формат: #RRGGBB"); };
  c.onchange = () => { tx.value = c.value.toUpperCase(); send(c.value); };
  tx.onchange = () => { let v = tx.value.trim(); if (v[0] !== "#") v = "#" + v; send(v); };
  binders.push(s => { const v = s.text[id]; if (!v || document.activeElement === tx) return;
    tx.value = v; if (isHex(v)) c.value = v.toLowerCase(); });
  box.append(c, tx);
  return box;
}

  if (item.t === "switch") {
    const w = el("label", "sw"); const i = el("input"); i.type = "checkbox"; w.append(i, el("span"));
    i.onchange = () => setVal("switch", item.id, i.checked ? "on" : "off");
    binders.push(s => { const v = s.switch[item.id]; if (v !== undefined) i.checked = v; });
    r.appendChild(w);
  } else if (item.t === "number" && item.kind === "slider") {
    const box = el("div", "slider"); const i = el("input"); i.type = "range"; const v = el("span", "val");
    i.oninput = () => { v.textContent = i.value + " " + item.unit; fillRange(i); };
    i.onchange = () => setVal("number", item.id, i.value);
    binders.push(s => { const n = s.number[item.id]; if (!n || document.activeElement === i) return;
      i.min = n.min; i.max = n.max; i.step = n.step; i.value = n.v; v.textContent = n.v + " " + item.unit; fillRange(i); });
    box.append(i, v); r.appendChild(box);
  } else if (item.t === "number") {
    const i = el("input"); i.type = "number";
    i.onchange = () => setVal("number", item.id, i.value);
    binders.push(s => { const n = s.number[item.id]; if (!n || document.activeElement === i) return;
      i.min = n.min; i.max = n.max; i.step = n.step; i.value = n.v; });
    r.append(i, el("span", "unit", item.unit));
  } else if (item.t === "line") {
    const i = el("input", "line-input"); i.type = "text"; i.maxLength = 64; i.placeholder = "порожньо";
    i.onfocus = () => lastLine = { input: i, id: item.id };

  } else if (item.t === "entity") {

    binders.push(s => { const v = s.text[item.id]; if (v !== undefined && document.activeElement !== box.input) box.input.value = v; });
    r.appendChild(box.element);

    r.appendChild(colorPicker(item.id));
  } else if (item.t === "select") {
    const sel = el("select");
    sel.onchange = () => setVal("select", item.id, sel.value);
    binders.push(s => { const o = s.select[item.id]; if (!o || document.activeElement === sel) return;

    const v = el("span", "val", "–");
    binders.push(s => { const x = s.sensor[item.id]; v.textContent = x == null ? "–" : (item.fmt ? item.fmt(x) : x); });

    r.appendChild(b);
  }
  return r;
}

/* ===================== пікселі ===================== */
function drawPixels(ctx, cv, W, H, rgb, normalize) {
  const cell = cv.width / W;
  if (cv.height !== Math.round(cell * H)) cv.height = Math.round(cell * H);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!rgb) return;
  let k = 1;
  if (normalize) {
    let max = 0;
    for (let i = 0; i < rgb.length; i++) if (rgb[i] > max) max = rgb[i];
    k = max > 0 ? Math.min(255 / max, 8) : 1;
  }
  const gap = Math.max(1, Math.round(cell * 0.12));
  // Живий кадр приходить у лінійних значеннях (після гамми 2.8) — повертаємо до вигляду на екрані
  const ug = v => normalize ? 255 * Math.pow(Math.min(255, v * k) / 255, 1 / 2.8) : v;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const p = (y * W + x) * 3;
    const R = ug(rgb[p]), G = ug(rgb[p + 1]), B = ug(rgb[p + 2]);
    if (R + G + B < 12) continue;
    ctx.fillStyle = `rgb(${R | 0},${G | 0},${B | 0})`;
    ctx.fillRect(Math.round(x * cell) + gap / 2, Math.round(y * cell) + gap / 2, Math.round(cell) - gap, Math.round(cell) - gap);
  }
}

const cv = $("live"), ctx = cv.getContext("2d");
let frame = null;
const draw = () => drawPixels(ctx, cv, state ? state.w : 32, state ? state.h : 16, frame, true);

async function liveLoop() {
  if (!document.hidden && $("page-dash").classList.contains("active")) {
    try {
      const r = await fetch("/api/live", { cache: "no-store" });
      if (r.ok) {
        const hex = await r.text();
        const n = hex.length / 2, f = new Uint8Array(n);
        for (let i = 0; i < n; i++) f[i] = parseInt(hex.substr(i * 2, 2), 16);
        frame = f; draw();
      }
    } catch (e) { /* зв'язок зник — статус покаже loadState */ }
  }
  setTimeout(liveLoop, 200);
}

function screenshot() {
  cv.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "wall-matrix-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".png";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
}

/* ===================== Home Assistant: пошук сутностей ===================== */
// Браузер ходить у WebSocket API HA напряму з довготривалим токеном — лише щоб
// отримати список сутностей. Токен лежить у localStorage і на панель не надсилається.
const HA_KEY = "wall-matrix-ha";
const haCfg = () => { try { return JSON.parse(localStorage.getItem(HA_KEY)) || {}; } catch { return {}; } };
const ha = { entities: null, error: "", loading: null };

function haGetStates(url, token) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket(url.replace(/\/+$/, "").replace(/^http/, "ws") + "/api/websocket"); }
    catch (e) { return reject(new Error("невірна адреса: " + e.message)); }
    const timer = setTimeout(() => { ws.close(); reject(new Error("Home Assistant не відповідає")); }, 10000);
    const done = (fn, v) => { clearTimeout(timer); ws.close(); fn(v); };
    ws.onerror = () => done(reject, new Error("не вдалося підключитися (перевірте адресу, http/https і порт)"));
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "auth_required") ws.send(JSON.stringify({ type: "auth", access_token: token }));
      else if (m.type === "auth_invalid") done(reject, new Error("Home Assistant відхилив токен"));
      else if (m.type === "auth_ok") ws.send(JSON.stringify({ id: 1, type: "get_states" }));
      else if (m.type === "result" && m.id === 1)
        m.success ? done(resolve, m.result) : done(reject, new Error(m.error?.message || "помилка get_states"));
    };
  });
}

function loadHaEntities(force = false) {
  const { url, token } = haCfg();
  if (!url || !token) { ha.entities = null; ha.error = ""; return Promise.resolve(null); }
  if (ha.loading && !force) return ha.loading;
  if (ha.entities && !force) return Promise.resolve(ha.entities);
  ha.loading = haGetStates(url, token)
    .then(states => {
      ha.entities = states.map(s => ({ id: s.entity_id, name: s.attributes?.friendly_name || "", state: s.state,
        unit: s.attributes?.unit_of_measurement || (s.entity_id.startsWith("weather.") && s.attributes?.temperature != null
          ? `${s.attributes.temperature}${s.attributes.temperature_unit || "°"}` : "") }))
        .sort((a, b) => a.id.localeCompare(b.id));
      ha.error = "";
      return ha.entities;
    })
    .catch(e => { ha.entities = null; ha.error = e.message || String(e); return null; })
    .finally(() => { ha.loading = null; });
  return ha.loading;
}

// Поле сутності з підказками під час набору. domains — дозволені домени (null — усі).
function entityField(domains, onCommit) {
  const element = el("div", "ent"), input = el("input"), list = el("div", "ent-list");
  input.type = "text"; input.autocomplete = "off"; input.spellcheck = false; input.placeholder = "weather.home";
  list.hidden = true;
  element.append(input, list);
  let hits = [], active = -1, committed = "";
  const commit = v => { list.hidden = true; if (v !== committed) { committed = v; onCommit(v); } };
  const choose = e => { input.value = e.id; commit(e.id); input.blur(); };
  const highlight = () => [...list.children].forEach((n, i) => { n.classList.toggle("on", i === active); if (i === active) n.scrollIntoView({ block: "nearest" }); });
  const show = async () => {
    if (!ha.entities) await loadHaEntities();
    if (document.activeElement !== input) return;
    if (!ha.entities) {
      list.replaceChildren(el("div", "ent-note", ha.error ? "Пошук недоступний: " + ha.error
        : "Щоб шукати сутності, підключіть Home Assistant у вкладці «Система»."));
      list.hidden = false; return;
    }
    const words = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    hits = ha.entities.filter(e => !domains || domains.includes(e.id.split(".")[0]))
      .filter(e => words.every(w => e.id.includes(w) || e.name.toLowerCase().includes(w))).slice(0, 60);
    active = -1;
    list.replaceChildren(...(hits.length ? hits.map(e => {
      const b = el("button", "ent-item"); b.type = "button";
      b.append(el("b", null, ""), el("code", null, ""), el("span", null, ""));
      b.children[0].textContent = e.name || e.id; b.children[1].textContent = e.id;
      b.children[2].textContent = e.unit && !e.id.startsWith("weather.") ? `${e.state} ${e.unit}` : (e.unit || e.state);
      b.onmousedown = ev => ev.preventDefault();
      b.onclick = () => choose(e);
      return b;
    }) : [el("div", "ent-note", "Нічого не знайдено")]));
    list.hidden = false;
  };
  input.addEventListener("focus", () => { committed = input.value; show(); });
  input.addEventListener("input", show);
  input.addEventListener("blur", () => commit(input.value.trim()));
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); active >= 0 && hits[active] ? choose(hits[active]) : input.blur(); return; }
    if (ev.key === "Escape") { list.hidden = true; return; }
    if (list.hidden || !hits.length || (ev.key !== "ArrowDown" && ev.key !== "ArrowUp")) return;
    ev.preventDefault();
    active = (active + (ev.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
    highlight();
  });
  return { element, input };
}

function setupHaForm() {
  const c = haCfg();
  $("haUrl").value = c.url || "http://homeassistant.local:8123";
  $("haToken").value = c.token || "";
  const status = async () => {
    const { url, token } = haCfg();
    if (!url || !token) { $("haStatus").textContent = "Не підключено. Токен: профіль HA → Безпека → Довготривалі токени доступу."; return; }
    $("haStatus").textContent = "Перевіряю…";
    const list = await loadHaEntities(true);
    $("haStatus").textContent = list ? `Підключено: ${list.length} сутностей.` : "Помилка: " + ha.error;
  };
  $("haSave").onclick = () => {
    localStorage.setItem(HA_KEY, JSON.stringify({ url: $("haUrl").value.trim(), token: $("haToken").value.trim() }));
    status();
  };
  $("haForget").onclick = () => { localStorage.removeItem(HA_KEY); $("haToken").value = ""; ha.entities = null; status(); };
  status();
}

/* ===================== черга застосунків ===================== */
const APP_NAMES = { Time: "Годинник", Date: "Дата", Weather: "Погода", Text: "Текст" };
let apps = [];

async function loadApps() {
  try { apps = await api("GET", "apps"); } catch (e) { return; }
  const host = $("appList"); if (!host) return;
  host.replaceChildren(...apps.map((a, i) => {
    const r = el("div", "app-row" + (a.active ? " active" : "") + (a.present ? "" : " gone"));
    const nm = el("div", "nm", `<b>${APP_NAMES[a.name] || a.name}</b>`);
    const sub = a.origin === "pushed" ? [a.text, a.icon && "іконка " + a.icon, a.lifetimeMs ? `живе ${Math.round(a.lifetimeMs / 1000)} с` : ""]
      .filter(Boolean).join(" · ") : (a.active ? "показується зараз" : `${Math.round(a.durationMs / 1000)} с`);
    nm.appendChild(el("span", null, sub || ""));
    const up = el("button", "mini", "↑"), down = el("button", "mini", "↓");
    up.disabled = i === 0; down.disabled = i === apps.length - 1;
    up.onclick = () => moveApp(i, -1); down.onclick = () => moveApp(i, 1);
    const w = el("label", "sw"), cb = el("input"); cb.type = "checkbox"; cb.checked = a.enabled; w.append(cb, el("span"));
    cb.onchange = () => { a.enabled = cb.checked; saveOrder(); };
    const show = el("button", null, "Показати");
    show.disabled = !a.present;
    show.onclick = () => apiTry("PUT", "apps/active", { name: a.name }).then(() => setTimeout(loadApps, 300));
    const parts = [el("span", "pos", String(i + 1)), up, down, nm,
      el("span", "badge" + (a.origin === "pushed" ? " pushed" : ""), a.origin === "pushed" ? "pushed" : "вбудований"), w, show];
    if (a.origin === "pushed") {
      const del = el("button", "mini danger", "✕"); del.title = "Видалити";
      del.onclick = async () => { if (confirm(`Видалити застосунок «${a.name}»?`) && await apiTry("DELETE", "apps/" + encodeURIComponent(a.name))) setTimeout(loadApps, 300); };
      parts.push(del);
    }
    r.append(...parts);
    return r;
  }));
}
function moveApp(i, d) {
  const j = i + d; if (j < 0 || j >= apps.length) return;
  [apps[i], apps[j]] = [apps[j], apps[i]];
  saveOrder();
}
async function saveOrder() {
  await apiTry("PUT", "apps/order", { order: apps.map(a => a.name), disabled: apps.filter(a => !a.enabled).map(a => a.name) });
  setTimeout(loadApps, 300);
}

/* ===================== бібліотека іконок ===================== */
const MAX_FRAMES = 16;
let icons = [];                  // [{name, width, height, frames, bytes}]
const iconCache = new Map();     // name → {key, w, h, frames: [{delay, rgb}]}
const animated = new Set();      // canvas'и, що анімуються

function decodeWM(b) {
  const n = b[2], w = b[3], h = b[4], fb = w * h * 3, frames = [];
  let p = 6;
  for (let i = 0; i < n; i++) { frames.push({ delay: b[p] | (b[p + 1] << 8), rgb: b.slice(p + 2, p + 2 + fb) }); p += 2 + fb; }
  return { w, h, frames };
}
function encodeWM(w, h, frames) {
  const fb = w * h * 3, buf = new Uint8Array(6 + frames.length * (2 + fb));
  buf.set([0x57, 0x4D, frames.length, w, h, 0]);
  let p = 6;
  for (const f of frames) { buf[p] = f.delay & 0xFF; buf[p + 1] = f.delay >> 8; buf.set(f.rgb, p + 2); p += 2 + fb; }
  return buf;
}
async function iconData(meta) {
  const key = meta.name + ":" + meta.bytes + ":" + meta.frames;
  const c = iconCache.get(meta.name);
  if (c && c.key === key) return c;
  const d = decodeWM(await api("GET", "icons/" + encodeURIComponent(meta.name)));
  d.key = key; iconCache.set(meta.name, d);
  return d;
}
function animate(cv, d) { cv._icon = d; cv._t0 = performance.now(); animated.add(cv); }
function drawIconThumb(cv, name) {
  const d = iconCache.get(name);
  if (!d) { animated.delete(cv); drawPixels(cv.getContext("2d"), cv, 16, 16, null); return; }
  animate(cv, d);
}
setInterval(() => {
  const now = performance.now();
  for (const cv of animated) {
    if (!cv.isConnected) { animated.delete(cv); continue; }
    const d = cv._icon, fs = d.frames;
    let t = (now - cv._t0) % fs.reduce((s, f) => s + Math.max(f.delay, 20), 0), i = 0;
    while (i < fs.length - 1 && t >= Math.max(fs[i].delay, 20)) { t -= Math.max(fs[i].delay, 20); i++; }
    if (cv._frame === i && cv._drawn === d) continue;
    cv._frame = i; cv._drawn = d;
    drawPixels(cv.getContext("2d"), cv, d.w, d.h, fs[i].rgb, false);
  }
}, 40);

function iconSelVal(sel, v) {
  if (![...sel.options].some(o => o.value === v)) { const o = el("option", null, v + " (немає)"); o.value = v; sel.appendChild(o); }
  sel.value = v;
}
function fillIconSelects() {
  for (const [id, none] of [["textIconSel", null], ["notifyIcon", "без іконки"]]) {
    const sel = $(id); if (!sel) continue;
    const cur = sel.value;
    sel.replaceChildren(...(none ? [Object.assign(el("option", null, none), { value: "" })] : []),
      ...icons.map(i => Object.assign(el("option", null, `${i.name} · ${i.width}×${i.height}`), { value: i.name })));
    if (cur) iconSelVal(sel, cur);
  }
  if (state) { const v = state.text.text_icon_name; if (v) { iconSelVal($("textIconSel"), v); drawIconThumb($("textIconPrev"), v); } }
}

async function loadIcons() {
  let lib;
  try { lib = await api("GET", "icons"); } catch (e) { return; }
  icons = lib.icons || [];
  await Promise.all(icons.map(m => iconData(m).catch(() => null)));
  $("icStore").style.width = Math.min(100, lib.usedBytes / lib.totalBytes * 100) + "%";
  $("icStoreTxt").textContent = `${icons.length} з ${lib.maxIcons} іконок · ${(lib.usedBytes / 1024).toFixed(1)} з ${(lib.totalBytes / 1024).toFixed(0)} КБ`;
  $("icGrid").replaceChildren(...(icons.length ? icons.map(m => {
    const t = el("div", "tile"), cv = el("canvas"); cv.width = cv.height = 160;
    const d = iconCache.get(m.name); if (d) animate(cv, d);
    const show = el("button", null, "Показати"), del = el("button", "danger", "✕");
    show.onclick = () => apiTry("POST", "notifications", { icon: m.name, text: m.name, durationMs: 3000, stack: false });
    del.onclick = async () => { if (confirm(`Видалити іконку «${m.name}»?`) && await apiTry("DELETE", "icons/" + encodeURIComponent(m.name))) setTimeout(loadIcons, 500); };
    const tb = el("div", "tb"); tb.append(show, del);
    t.append(cv, el("div", "tn", m.name), el("div", "tm", `${m.width}×${m.height} · ${m.frames} кадр.`), tb);
    return t;
  }) : [el("div", "muted", "Поки порожньо. Додайте першу іконку вище.")]));
  fillIconSelects();
}

// Будь-яке зображення → size×size RGB (вписуємо з полями; прозоре → чорне)
function toRGB(img, w, h, size) {
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingEnabled = !(w <= size && h <= size);  // піксель-арт не розмиваємо
  x.imageSmoothingQuality = "high";
  const s = Math.min(size / w, size / h);
  const dw = Math.max(1, Math.round(w * s)), dh = Math.max(1, Math.round(h * s));
  x.drawImage(img, Math.floor((size - dw) / 2), Math.floor((size - dh) / 2), dw, dh);
  const d = x.getImageData(0, 0, size, size).data, out = new Uint8Array(size * size * 3);
  for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
    const a = d[i + 3] / 255;
    if (a < 0.5) continue;
    out[j] = d[i] * a; out[j + 1] = d[i + 1] * a; out[j + 2] = d[i + 2] * a;
  }
  return out;
}
async function decodeFrames(file, size) {
  if (file.type === "image/gif" && "ImageDecoder" in window) {
    const dec = new ImageDecoder({ data: await file.arrayBuffer(), type: file.type });
    await dec.tracks.ready;
    const total = dec.tracks.selectedTrack.frameCount, n = Math.min(total, MAX_FRAMES), frames = [];
    for (let i = 0; i < n; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const delay = Math.min(10000, Math.max(20, Math.round((image.duration || 100000) / 1000)));
      frames.push({ delay, rgb: toRGB(image, image.displayWidth, image.displayHeight, size) });
      image.close();
    }
    if (total > MAX_FRAMES) toast(`Узято перші ${MAX_FRAMES} кадрів`);
    return frames;
  }
  const bmp = await createImageBitmap(file);
  return [{ delay: 1000, rgb: toRGB(bmp, bmp.width, bmp.height, size) }];
}
async function uploadIcon(file, name, size) {
  if (!/^[A-Za-z0-9_-]{1,23}$/.test(name)) throw new Error("ім'я: латиниця, цифри, _ і -");
  const frames = await decodeFrames(file, size);
  if (await apiTry("PUT", "icons/" + encodeURIComponent(name), encodeWM(size, size, frames))) {
    toast(`Іконку «${name}» збережено`);
    iconCache.delete(name);
    setTimeout(loadIcons, 600);
  }
}

/* ===================== старт ===================== */
build();
setupHaForm();
draw();
loadState();
loadIcons();
loadApps();
setInterval(loadState, 2000);
setInterval(() => { if ($("page-apps").classList.contains("active")) loadApps(); }, 3000);
liveLoop();
</script>
