# =============================================================================
#  Wall Matrix — настінна панель 32×16 (8 панелей WS2812B 8×8, сітка 4×2)
#  Плата: YD-ESP32-23 (ESP32-S3 N16R8)
# =============================================================================

substitutions:
  name: wall-matrix
  friendly_name: Wall Matrix

  # --- Підключення матриці (типові значення; змінюються у веб-панелі) ---
  # chain  — матриця ПІСЛЯ вбудованого WS2812 плати (GPIO48): його DOUT → DIN першої панелі.
  #          Вбудований світлодіод живиться від ~4.7 В і сам піднімає рівень сигналу.
  # direct — DIN матриці на окремий пін (matrix_pin); вбудований світлодіод — лише індикатор.
  matrix_wiring: chain
  matrix_pin: "5"          # пін матриці в режимі direct
  status_pin: "48"         # вбудований RGB-світлодіод плати
  ldr_pin: GPIO4           # фоторезистор (дільник з 10 кОм), ADC1
  ldr_pin_num: "4"         # той самий пін числом — щоб не запропонувати його для матриці

  # --- Матриця ---
  # true — якщо всередині панелі світлодіоди йдуть змійкою (парні рядки
  # зліва направо, непарні справа наліво). Перевірте тестовим екраном;
  # змінюється й у веб-панелі.
  panel_serpentine: "false"
  # Обмеження максимального струму: 0.4 ≈ 12 А на повному білому при 100% яскравості.
  # Фактична корекція = max_power × яскравість (див. lambda дисплея).
  max_power: "0.4"

  # --- Час ---
  timezone: Europe/Kyiv     # IANA-зона; взята з Windows (FLE Standard Time)

  # --- Home Assistant ---
  # Типова сутність погоди; змінюється з веб-панелі без перепрошивки
  weather_entity: weather.forecast_home

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - includes/matrix_gfx.h

packages:
  core: !include packages/core.yaml
  display: !include packages/display.yaml
  sensors: !include packages/sensors.yaml
  admin: !include packages/admin.yaml
